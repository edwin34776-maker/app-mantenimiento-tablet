name: 📧 Reporte Preventivo Diario 6:45AM

on:
  schedule:
    # 6:45 AM hora de Colombia
    - cron: "45 6 * * *"
      timezone: "America/Bogota"

  # Permite probar el envío manualmente desde GitHub Actions
  workflow_dispatch:

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas openpyxl

      - name: 📧 Enviar reporte diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          AREA_MECANICA: ${{ secrets.AREA_MECANICA }}
        run: |
          python enviar_reporte_diario.py
